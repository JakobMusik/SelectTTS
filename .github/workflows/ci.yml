name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test cores
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        working-directory: Packages/SelectTTSKit
        run: swift build -v
      - name: Test
        working-directory: Packages/SelectTTSKit
        run: swift test

  app-build:
    name: Build app
    # The committed project uses Xcode 16 synchronized folders (objectVersion 77), and the pinned
    # KeyboardShortcuts 2.4.0 needs Swift tools 6.1 (Xcode 16.3+) — both too new for macos-14.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build (signing disabled)
        run: |
          xcodebuild -project SelectTTS.xcodeproj -scheme SelectTTS \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build

  lint:
    name: Lint (informational)
    runs-on: macos-14
    # Non-gating until the style config is hardened.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install swiftlint swiftformat
      - name: SwiftFormat (lint mode)
        run: swiftformat --lint .
      - name: SwiftLint
        run: swiftlint lint --quiet
